services:
  - type: web
    name: tenantai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tenantai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_DIR
        value: /opt/render/project/src/backend/storage
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SESSION_TIMEOUT_SECONDS
        value: "120"

  - type: web
    name: tenantai-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

  - type: worker
    name: tenantai-telegram-bot
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python telegram_bot.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tenantai-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: tenantai-backend
          envVarKey: SECRET_KEY
      - key: ENVIRONMENT
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SESSION_TIMEOUT_SECONDS
        value: "120"

databases:
  - name: tenantai-db
    databaseName: tenantai
    user: tenantai
